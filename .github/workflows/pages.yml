# Publica en GitHub Pages:
#   presentacion/web          → https://natch1623.github.io/Tecnologia-electrica/
#   presentacion-mi815/web    → https://natch1623.github.io/Tecnologia-electrica/perfil-mi815/
name: Publicar presentación en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "presentacion/web/**"
      - "presentacion-mi815/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Armar el sitio
        run: |
          mkdir -p _site
          cp -r presentacion/web/. _site/
          mkdir -p _site/perfil-mi815
          cp -r presentacion-mi815/web/. _site/perfil-mi815/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
